plugins {
    id 'java'
    id 'jacoco'
    id 'me.champeau.jmh' version '0.7.2'
}

group = 'customset'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    jmh 'org.openjdk.jmh:jmh-core:1.37'
    jmhAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport // Ensures code coverage report runs automatically after tests
}

jacoco {
    toolVersion = "0.8.11"
}

jacocoTestReport {
    reports {
        xml.required = true
        html.required = true
    }
}

jmh {
    includes = ['CustomSetV3Benchmark']

    fork = 3
    warmupIterations = 5          // ← best practical value
    iterations = 10
    timeOnIteration = '1s'
    warmup = '1s'

    resultFormat = 'CSV'
    resultsFile = file('custom-set-v3-results.csv')
}